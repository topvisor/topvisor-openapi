components:
  securitySchemes:
    authToken:
      type: apiKey
      description: 'Авторизация по API ключу в формате: `Bearer userId:AccessToken`'
      name: Authorization
      in: header
      bearerFormat: bearer
    authLogin:
      type: apiKey
      description: Авторизация доступна исключительно в браузере и только на официальном сайте с API
      name: auth
      in: cookie
  schemas:
    Selector.Types.FetchStyle:
      type: string
      enum:
        - fetchAll
        - fetchAllNum
        - fetchAllColumn
        - fetch
        - fetchColumn
        - fetchGroup
        - fetchGroupColumn
        - fetchUnique
        - fetchUniqueNum
        - fetchUniqueColumn
        - selector
      x-enum-varnames:
        - FetchAll
        - FetchAllNum
        - FetchAllColumn
        - Fetch
        - FetchColumn
        - FetchGroup
        - FetchGroupColumn
        - FetchUnique
        - FetchUniqueNum
        - FetchUniqueColumn
        - Selector
      x-enum-descriptions:
        - Список объектов
        - Список объектов в виде массивов, где элементы массива - это свойства объекта, перечисленные с сохранением своего порядка
        - Список значений одного свойства по каждому объекту
        - Один объект
        - Одно свойство одного объека
        - Объекты с группировкой
        - Значения свойства объектов с группировкой
        - Объекты с группировкой с объединением дублей
        - Значения свойства объектов с группировкой с объединением дублей
        - Список значений одного свойства по каждому объекту с объединением дублей
        - Внутренний объект метода Selector
      title: Формат результата в основном используется для Get запросов, поддерживается не всеми запросами в полной мере
      description: |-
        Указанием формата результата позволяет получать данные одного и того же метода в разном формате

        Данный параметр влияет на тип возвращаемого результата

        Данные параметр помогает избежать ненужных преобразований результатов на клиенте

        Напоминает логику работу PDO Fetch: https://www.php.net/manual/ru/pdostatement.fetch.php
    Payments_2.Methods.Get:
      type: object
      properties:
        fetch_style:
          title: 'Определяет формат результата: коллекция, объект, значение'
          description: |-
            Примеры:
            - fetchAll - получить коллекцию объектов
            - fetch - получить один объект
            - fetchColumn - получить свойсвто объекта
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Selector.Types.FetchStyle'
        fields:
          title: Список полей объекта, которые надо вернуть в результате
          description: |-
            Если запрос поддерживает параметр `fetch_style`, формат ответа может быть разным, `fields` будет влиять на содержание данных в этом ответе

            Использует поля модели
          type: array
        orders:
          title: Список полей объекта, по которым необходимо выполнить сортировку
          description: |-
            Поля могут быть строками или объектом: {name: string, direction: 'ASC' | 'DESC', orderValues: array, operator: string, values: array}

            Использует поля модели
          type: array
        filters:
          title: Список фильтров по полям объекта
          description: |-
            {name: string, operator: Selector\Types\Operator, values: array}

            Использует поля модели

            Поля обязательное, если $id не указан
          type: array
        id:
          title: Id объекта, для фильтрации объектов по id
          description: Только для моделей с полем id
          nullable: true
          type: integer
        limit:
          title: Количество объектов, которые необходимо получить в результате
          description: Используется в паре с offset
          nullable: true
          type: integer
        offset:
          title: Число объектов, которое необходимо пропустить при получении результата
          description: Используется в паре с limit
          type: integer
      required: []
      title: Получение списка платежей
    Payments_2.Methods.Get.Exec:
      nullable: true
    TV.API.Types.StringArray:
      type: array
      items:
        type: string
      title: 'Тип массива: string[]'
    ResponseSuccess:
      type: object
      properties:
        errors:
          title: Результат ответа API метода
          description: Тип результата зависит от типа запроса и его настроек
          nullable: true
          type: 'null'
        messages:
          title: Список сообщений, полученных при выполнении запроса
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TV.API.Types.StringArray'
      required: []
      title: Результат успешного API запроса
    Pagination:
      type: object
      properties:
        nextOffset:
          title: Смещение для получения следующий порции данных
          description: Вернется только в случае существования следующей порции
          nullable: true
          type: integer
        total:
          title: Общее число результатов, без учета применения пагинации
          nullable: true
          type: integer
      required: []
      title: Результаты пагинации
    Error:
      type: object
      properties:
        code:
          title: Код ошибки
          description: Код ошибки 0 - deprecated
          type: integer
        string:
          title: Описание ошибки
          type: string
        detail:
          title: Объект с дополнительной информацией
          description: |-
            - actions.triggers - параметры для генерации ссылки для кнопок на фронтенде.
             Нужно передать название и, если требуется, дополнительные параметры
          nullable: true
          anyOf:
            - type: object
              properties:
                text:
                  type: string
                actions:
                  type: array
                  items:
                    type: object
                    properties:
                      trigger:
                        type: object
                        properties:
                          name:
                            type: string
                          params:
                            type: object
                            additionalProperties: {}
                        required:
                          - name
                      text:
                        type: string
                      link:
                        type: string
                    required:
                      - text
                      - link
                location:
                  type: string
                fieldViolation:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string
                  required:
                    - field
                    - message
              required:
                - text
            - type: 'null'
      required:
        - code
        - string
      title: Информация об ошибке
    Errors:
      type: array
      items:
        $ref: '#/components/schemas/Error'
      title: Список ошибок
    ResponseError:
      type: object
      properties:
        result:
          title: При ошибке результат отсутствует
          nullable: true
          type: 'null'
        errors:
          title: Список ошибок, полученных при выполнении запроса
          allOf:
            - $ref: '#/components/schemas/Errors'
        messages:
          title: Список сообщений, полученных при выполнении запроса
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TV.API.Types.StringArray'
      required:
        - errors
      title: Результат API запроса с ошибкой
