      type: object
      properties:
        id:
          type: string
        name:
          type: string
        priceUSD:
          type: integer
        annualDiscount:
          title: Скидка за годовую подписку в процентах от 0 до 1
          description: При расчете финальной стоимости может использоваться округление
          type: number
        maxByName:
          title: Выдаваемые лимиты
          type: object
